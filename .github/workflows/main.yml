name: Update v2rayN nodes

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 🔥 关键：禁止并发（防止自己打自己）
concurrency:
  group: v2rayN-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch v2rayN nodes
        run: python fetch_nodes.py

      - name: Commit & push (safe force)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin main
          git checkout main
          git rebase origin/main || git rebase --abort

          git add v2rayN_nodes.txt
          git commit -m "auto update v2rayN nodes" || echo "no changes"

          # 🔥 核心：安全强推（不会覆盖别人新提交）
          git push origin main --force-with-lease
