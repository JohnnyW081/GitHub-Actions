name: Update v2rayN nodes

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点执行
  workflow_dispatch:      # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # --------------------------
      # checkout nodes 分支
      # --------------------------
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Prepare nodes branch
        run: |
          git fetch origin main
          git checkout -B nodes origin/main

      # --------------------------
      # 设置 Python
      # --------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 安装 requests
      - name: Install dependencies
        run: pip install requests

      # --------------------------
      # 下载并执行抓节点脚本
      # --------------------------
      - name: Fetch and generate nodes
        run: |
          # 写入 fetch_nodes.py
          cat << 'EOF' > fetch_nodes.py
import requests
import re

sources = [
    "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/all_extracted_configs.txt",
    "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vmess_configs.txt",
    "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/trojan_configs.txt",
]
headers={"User-Agent":"Mozilla/5.0"}

def classify_node(node:str):
    node=node.strip()
    if node.startswith("vmess://"): return "vmess"
    if node.startswith("trojan://"): return "trojan"
    if node.startswith("trojan-go://"): return "trojan-go"
    return "unknown"

all_nodes=set()
for url in sources:
    try:
        r=requests.get(url,headers=headers,timeout=10)
        lines=[l.strip() for l in r.text.splitlines() if l.strip()]
        print(f"[DEBUG] {url} fetched {len(lines)} lines")
        all_nodes.update(lines)
    except Exception as e:
        print(f"[WARN] Failed to fetch {url}: {e}")

vmess_nodes=[n for n in all_nodes if classify_node(n)=="vmess"]
trojan_nodes=[n for n in all_nodes if classify_node(n)=="trojan"]
trojan_go_nodes=[n for n in all_nodes if classify_node(n)=="trojan-go"]

def write_txt(filename,nodes):
    with open(filename,"w",encoding="utf-8") as f:
        for n in nodes:
            f.write(n+"\n")
    print(f"[INFO] {filename} generated with {len(nodes)} nodes")

write_txt("v2rayN_nodes.txt",all_nodes)
write_txt("vmess.txt",vmess_nodes)
write_txt("trojan.txt",trojan_nodes)
write_txt("trojan-go.txt",trojan_go_nodes)
EOF

          python fetch_nodes.py

      # --------------------------
      # Commit & Push nodes 分支
      # --------------------------
      - name: Commit and push
        run: |
          git config user.name "JohnnyW081"
          git config user.email "actions@github.com"
          git add v2rayN_nodes.txt vmess.txt trojan.txt trojan-go.txt
          git commit -m "auto update v2rayN nodes" || echo "no changes"
          git push origin nodes --force
